[server]
bind = "0.0.0.0:8080"

[upstream]
base_url = "http://mock-llm:14000"
api_key = "example-mock-llm-key"

[security]
max_prompt_chars = 32768
deny_prompt_injection = true
deny_secret_patterns = true
redact_pii = true
audit_log_path = "logs/audit.jsonl"

[memory]
enabled = true
base_url = "http://slicerag:8095"
max_chunks = 3
timeout_seconds = 2

[api_keys."example-aegis-token"]
project = "aegis-demo-finance"
role = "admin"
allowed_models = ["gpt-4"]
rpm = 120
