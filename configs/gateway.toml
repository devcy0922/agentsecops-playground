[server]
bind = "0.0.0.0:8080"

[upstream]
base_url = "http://mock-llm:14000"

[security]
max_prompt_chars = 32768
deny_prompt_injection = true
deny_secret_patterns = true
redact_pii = true
audit_log_path = "logs/audit.jsonl"

[memory]
enabled = true
base_url = "http://slicerag:8095"
max_chunks = 3
timeout_seconds = 2

# 업스트림 키와 클라이언트 키는 공개 파일에 두지 않고
# GOVAIL_UPSTREAM_API_KEY 및 GOVAIL_API_KEYS 환경변수로 주입합니다.
