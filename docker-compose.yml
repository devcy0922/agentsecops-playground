services:
  mock-llm:
    build:
      context: ./mock-llm
    ports:
      - "127.0.0.1:${MOCK_LLM_HOST_PORT:-28000}:14000"
    networks:
      - aegis-net

  mock-llm-fallback:
    build:
      context: ./mock-llm
    ports:
      - "127.0.0.1:${MOCK_LLM_FALLBACK_HOST_PORT:-28001}:14000"
    networks:
      - aegis-net

  slicerag:
    build:
      context: ../slicerag
    ports:
      - "127.0.0.1:${SLICERAG_HOST_PORT:-28095}:8095"
    environment:
      - SLICERAG_STORE=memory
      - SLICERAG_EMBEDDING_PROVIDER=hash
    networks:
      - aegis-net

  aegis-llm:
    build:
      context: ../aegis-llm
    ports:
      - "127.0.0.1:${AEGIS_HOST_PORT:-28080}:8080"
    volumes:
      - ./configs/gateway.toml:/app/configs/gateway.toml
      - ./artifacts/aegis-logs:/app/logs
    environment:
      - RUST_LOG=aegis_llm=info,tower_http=info
      - GOVAIL_CONFIG=/app/configs/gateway.toml
      - GOVAIL_FALLBACK_UPSTREAM_URL=http://mock-llm-fallback:14000/v1
    depends_on:
      - mock-llm
      - mock-llm-fallback
      - slicerag
    networks:
      - aegis-net

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - aegis-net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    networks:
      - aegis-net

networks:
  aegis-net:
    name: aegis-net
    driver: bridge
